# Local development only. No fixture/account creation on startup; no production deployment claim.
x-django-environment: &django_environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a random DJANGO_SECRET_KEY}
  ARTI_ENV: ${ARTI_ENV:-development}
  DJANGO_DEBUG: "false"
  PGHOST: db
  PGPORT: "5432"
  PGDATABASE: arti
  PGUSER: arti
  PGPASSWORD: ${ARTI_DB_PASSWORD:?Set ARTI_DB_PASSWORD}
x-reset-mail-environment: &reset_mail_environment
  ARTI_PASSWORD_RESET_ORIGIN: ${ARTI_PASSWORD_RESET_ORIGIN:-}
  ARTI_PASSWORD_RESET_FROM: ${ARTI_PASSWORD_RESET_FROM:-}
  EMAIL_HOST: ${EMAIL_HOST:-localhost}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: arti
      POSTGRES_USER: arti
      POSTGRES_PASSWORD: ${ARTI_DB_PASSWORD:?Set ARTI_DB_PASSWORD in an ignored env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U arti -d arti"]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: ./backend-django
    environment: &api_environment
      <<: [*django_environment, *reset_mail_environment]
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      ARTI_ALLOWED_ORIGINS: ${ARTI_ALLOWED_ORIGINS:-}
      ARTI_KAKAO_CLIENT_ID: ${ARTI_KAKAO_CLIENT_ID:-}
      ARTI_KAKAO_CLIENT_SECRET: ${ARTI_KAKAO_CLIENT_SECRET:-}
      ARTI_KAKAO_CALLBACK_URL: ${ARTI_KAKAO_CALLBACK_URL:-}
      ARTI_MODEL_SERVICE_URL: ${ARTI_MODEL_SERVICE_URL:-}
      ARTI_TASTE_PROFILE_V2_ENABLED: ${ARTI_TASTE_PROFILE_V2_ENABLED:-false}
      ARTI_TASTE_APPROVED_SIGNATURE_SHA256: ${ARTI_TASTE_APPROVED_SIGNATURE_SHA256:-}
      ARTI_LLM_PROVIDER: ${ARTI_LLM_PROVIDER:-disabled}
      ARTI_DOCENT_COLLECTION_TOOL_EXHIBITIONS: ${ARTI_DOCENT_COLLECTION_TOOL_EXHIBITIONS:-}
      ARTI_DOCENT_LIVE_COLLECTION_EXHIBITIONS: ${ARTI_DOCENT_LIVE_COLLECTION_EXHIBITIONS:-}
      ARTI_DOCENT_VISIT_CONTEXT_EXHIBITIONS: ${ARTI_DOCENT_VISIT_CONTEXT_EXHIBITIONS:-}
      ARTI_DOCENT_TRANSCRIPTS_ENABLED: ${ARTI_DOCENT_TRANSCRIPTS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ARTI_AI_SETTINGS_ENCRYPTION_KEY: ${ARTI_AI_SETTINGS_ENCRYPTION_KEY:-}
      ARTI_LLM_MODEL_ANSWER: ${ARTI_LLM_MODEL_ANSWER:-}
      ARTI_LLM_MODEL_EXPLANATION: ${ARTI_LLM_MODEL_EXPLANATION:-}
      ARTI_LLM_MODEL_SUMMARY: ${ARTI_LLM_MODEL_SUMMARY:-}
      ARTI_LLM_MODEL_GUIDE: ${ARTI_LLM_MODEL_GUIDE:-}
      ARTI_LLM_MODEL_INTERPRET: ${ARTI_LLM_MODEL_INTERPRET:-}
      ARTI_LLM_JSON_MODE: ${ARTI_LLM_JSON_MODE:-true}
      ARTI_LLM_TOKEN_PARAMETER: ${ARTI_LLM_TOKEN_PARAMETER:-max_completion_tokens}
      ARTI_DRAFT_PROVIDER: ${ARTI_DRAFT_PROVIDER:-default}
      ARTI_DRAFT_BASE_URL: ${ARTI_DRAFT_BASE_URL:-}
      ARTI_DRAFT_API_KEY: ${ARTI_DRAFT_API_KEY:-}
      ARTI_DRAFT_MODEL: ${ARTI_DRAFT_MODEL:-}
      ARTI_DRAFT_TOKEN_PARAMETER: ${ARTI_DRAFT_TOKEN_PARAMETER:-max_tokens}
      ARTI_DRAFT_JSON_MODE: ${ARTI_DRAFT_JSON_MODE:-true}
      ARTI_DRAFT_GUIDE_REVIEW: ${ARTI_DRAFT_GUIDE_REVIEW:-false}
      ARTI_LUNA_DRAFT_VISION: ${ARTI_LUNA_DRAFT_VISION:-false}
      ALLOW_TEST_FIXTURES: ${ALLOW_TEST_FIXTURES:-false}
      ARTI_EXHIBITION_ORDER_DEMO_ENABLED: ${ARTI_EXHIBITION_ORDER_DEMO_ENABLED:-false}
      MEDIA_ROOT: /app/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${ARTI_API_PORT:-4018}:8000"
    volumes:
      - media_data:/app/media
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20
  migrate:
    build: ./backend-django
    environment: *api_environment
    command: [python, manage.py, migrate, --noinput]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  reset-mail:
    profiles: [reset-mail]
    build: ./backend-django
    environment:
      <<: [*django_environment, *reset_mail_environment]
    command: [python, manage.py, send_password_reset_mail, --watch]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    profiles: [ui]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_PROXY: http://api:8000
      VITE_API_TARGET: django
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ARTI_UI_PORT:-5178}:5173"
volumes:
  postgres_data:
  media_data:
