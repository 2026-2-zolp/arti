<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>ARTI 비밀번호 재설정 링크</title>
  <style>
    @media (prefers-color-scheme: dark) {
      .page { background-color: #1c1c1c !important; }
      .card { background-color: #262421 !important; border-color: #4a4640 !important; color: #fdfcf9 !important; }
      .secondary { color: #e5e1da !important; }
      .action { background-color: #fdfcf9 !important; color: #1c1c1c !important; }
    }
  </style>
</head>
<body class="page" style="margin:0; background-color:#fdfcf9;">
  <table class="page" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fdfcf9;">
    <tr>
      <td align="center" style="padding:24px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
          <tr>
            <td class="card" style="padding:24px; background-color:#fff; border:1px solid #e5e1da; border-radius:16px; color:#1c1c1c; font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; font-size:16px; line-height:1.6; word-break:keep-all; overflow-wrap:break-word;">
              <p style="margin:0 0 16px; font-size:20px; font-weight:700;">ARTI</p>
              <p style="margin:0 0 16px;">{{ introduction }}</p>
              <p style="margin:0 0 6px;">
                <a class="action" href="{{ link }}" style="display:inline-block; padding:12px 20px; border-radius:10px; background-color:#1c1c1c; color:#fff; font-weight:700; line-height:24px; text-decoration:none;">{{ action }}</a>
              </p>
              <p class="secondary" style="margin:0 0 20px; color:#4a4a4a; font-size:14px; overflow-wrap:anywhere; word-break:break-word;">연결 주소 {{ host }}</p>
              <p class="secondary" style="margin:0 0 12px; color:#4a4a4a;">{{ validity }}</p>
              <p class="secondary" style="margin:0; color:#4a4a4a;">{{ ignore }}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
