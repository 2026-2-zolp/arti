name: ARTI CI

on:
  pull_request:
  push:
    branches: [main, 'dev/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  django:
    name: Django PostgreSQL checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: arti
          POSTGRES_USER: arti
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arti -d arti"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret-at-least-32-characters
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      ARTI_ENV: test
      ALLOW_TEST_FIXTURES: 'true'
      ARTI_LLM_PROVIDER: disabled
      OPENAI_API_KEY: ''
      PGDATABASE: arti
      PGUSER: arti
      PGPASSWORD: ci-only-disposable-password
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      MEDIA_ROOT: /tmp/arti-ci-media
    defaults:
      run:
        working-directory: backend-django
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-django/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test arti.tests --noinput -v 2

  docent-browser:
    name: ${{ matrix.suite == 'visit-boundaries' && 'Visit Chrome (boundaries)' || matrix.suite == 'receipt-visibility' && 'Receipt Chrome (visibility)' || format('Docent Chrome ({0})', matrix.suite) }}
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [retry, artwork-change, guide-summary, receipt-visibility, visit-boundaries]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ${{ matrix.suite == 'visit-boundaries' && 'arti_visit_boundaries' || 'arti' }}
          POSTGRES_USER: arti
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arti -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret-at-least-32-characters
      ARTI_ENV: test
      ALLOW_TEST_FIXTURES: 'true'
      ARTI_TASTE_PROFILE_V2_ENABLED: 'true'
      ARTI_LLM_PROVIDER: disabled
      ARTI_MODEL_SERVICE_URL: ''
      OPENAI_API_KEY: ''
      ARTI_BOOTSTRAP_PASSWORD: ci-only-synthetic-docent-admin-42
      PGDATABASE: ${{ matrix.suite == 'visit-boundaries' && 'arti_visit_boundaries' || 'arti' }}
      PGUSER: arti
      PGPASSWORD: ci-only-disposable-password
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      MEDIA_ROOT: /tmp/arti-docent-media
      VITE_API_TARGET: django
      VITE_API_PROXY: http://127.0.0.1:8000
      ARTI_REVIEW_BASE: http://127.0.0.1:5239
      ARTI_BROWSER_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-django/requirements.lock
      - run: npm --prefix frontend ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix frontend run build
      - run: python -m pip install -r backend-django/requirements.lock
      - name: Load synthetic exhibition and administrator
        working-directory: backend-django
        env:
          ARTI_BROWSER_ADMIN: ${{ matrix.suite == 'visit-boundaries' && 'visit-boundaries-admin' || matrix.suite == 'receipt-visibility' && 'receipt-snapshot-admin' || 'docent-race-admin' }}
        run: |
          python manage.py migrate --noinput
          python manage.py load_test_fixture
          python manage.py bootstrap_admin --login-id "$ARTI_BROWSER_ADMIN" --name 'Synthetic administrator'
      - name: Run visit boundary Chrome twice
        if: matrix.suite == 'visit-boundaries'
        run: |
          node frontend/tests/runVisitBoundaries.browser.mjs
          node frontend/tests/runVisitBoundaries.browser.mjs
      - name: Run loopback Chrome regression
        if: matrix.suite != 'visit-boundaries'
        shell: bash
        env:
          ARTI_DOCENT_RACE_TESTS: ${{ matrix.suite == 'artwork-change' && '1' || '0' }}
          ARTI_DOCENT_ENTRY_TESTS: ${{ matrix.suite == 'guide-summary' && '1' || '0' }}
        run: |
          if [[ "$ARTI_BROWSER_SUITE" == receipt-visibility ]]; then
            server=(python backend-django/manage.py runserver 127.0.0.1:8000 --noreload)
            browser_test=frontend/tests/receiptVisibility.browser.cjs
          else
            server=(python backend-django/manage.py shell -c "from arti.tests.docent_browser_server import serve; serve('127.0.0.1')")
            browser_test=frontend/tests/docentRetry.browser.cjs
          fi
          "${server[@]}" >/dev/null 2>&1 &
          api_pid=$!
          node frontend/node_modules/vite/bin/vite.js preview --config frontend/vite.config.ts --host 127.0.0.1 --port 5239 --strictPort >/dev/null 2>&1 &
          frontend_pid=$!
          trap 'kill "$api_pid" "$frontend_pid" 2>/dev/null || true' EXIT

          for ((attempt = 0; attempt < 30; attempt++)); do
            if mock_header=$(curl --silent --fail --max-time 2 --output /dev/null --write-out '%header{x-arti-docent-mock}' "$ARTI_REVIEW_BASE/api/ready") &&
                { [[ "$ARTI_BROWSER_SUITE" == receipt-visibility ]] || [[ "$mock_header" == 1 ]]; }; then
              node "$browser_test"
              exit
            fi
            kill -0 "$api_pid" "$frontend_pid" 2>/dev/null || break
            sleep 1
          done
          if [[ "$ARTI_BROWSER_SUITE" == receipt-visibility ]]; then
            printf '%s\n' 'Receipt Chrome API readiness check failed.' >&2
          else
            printf '%s\n' '{"requestId":null,"status":null,"evidenceVersion":null}' >&2
          fi
          exit 1

  model-contracts:
    name: Model service fake checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ARTI_PRELOAD: 'false'
      ARTI_WRITER_ENABLED: 'false' # Current model role: CLIP/mDeBERTa; no legacy writer loading.
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  plan-contracts:
    name: Plan and contract checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # Pinned baseline and protected archive provenance.
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python docs/execution-plan/2026-11-07/verify_plan.py
      - run: python docs/execution-plan/2026-11-07/verify_guardrails.py
      - run: python docs/execution-plan/2026-11-07/records/W02/verify_contracts.py
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/git_materials.py
